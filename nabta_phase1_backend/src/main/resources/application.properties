spring.application.name=nabta-backend
server.port=${PORT:8080}
spring.datasource.url=${NABTA_DB_URL:jdbc:mysql://localhost:3306/nabta_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${NABTA_DB_USERNAME:root}
spring.datasource.password=${NABTA_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false
spring.jackson.time-zone=UTC
nabta.jwt.secret=${NABTA_JWT_SECRET:CHANGE_THIS_DEV_SECRET_TO_A_RANDOM_VALUE_32_CHARS_MINIMUM}
nabta.jwt.expiration-ms=${NABTA_JWT_EXPIRATION_MS:28800000}
nabta.cors.allowed-origins=${NABTA_CORS_ORIGINS:http://localhost:8100,http://localhost:5173,http://localhost:8080,http://localhost,https://localhost,capacitor://localhost,ionic://localhost}
nabta.admin.name=${NABTA_ADMIN_NAME:}
nabta.admin.email=${NABTA_ADMIN_EMAIL:}
nabta.admin.password=${NABTA_ADMIN_PASSWORD:}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
# Append these two lines to the existing src/main/resources/application.properties file.
# FCM remains disabled until the Firebase service-account file is configured.
nabta.fcm.enabled=${NABTA_FCM_ENABLED:false}
nabta.fcm.service-account-path=${NABTA_FCM_SERVICE_ACCOUNT_PATH:}
# Product images must use durable persistent storage in production.
nabta.media.upload-dir=${NABTA_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
# Saudi payment readiness foundation. No payment provider is integrated in this phase.
nabta.payment.country=${NABTA_PAYMENT_COUNTRY:SA}
nabta.payment.currency=${NABTA_PAYMENT_CURRENCY:SAR}
nabta.payment.provider=${NABTA_PAYMENT_PROVIDER:none}
nabta.payment.enabled=${NABTA_PAYMENT_ENABLED:false}
# Keep false until a real provider adapter, server-side verification, and order flow are implemented and tested.
nabta.payment.checkout-flow-implemented=${NABTA_PAYMENT_CHECKOUT_FLOW_IMPLEMENTED:false}
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
logging.level.org.springframework.security=TRACE